name: PR Checks
run-name: "PR ${{ github.event.pull_request.number }} | source ${{ github.sha }} | workflow ${{ github.workflow_sha }} | unit ${{ github.event.pull_request.draft && vars.ORCA_UNIT_SELECTION_MODE == 'selected' && 'selected' || 'full' }}"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep required verify present for docs-only PRs while routing expensive jobs by inputs; empty diffs fail closed to full checks.
  code_paths:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: detect changes and check repository guards
    # Hosted runners start faster than Blacksmith's (~5s vs ~13s) and this sparse checkout fits one vCPU.
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
      reused_run_id: ${{ steps.readiness.outputs.run_id }}
      # A proven success masks required work only; advisory routing still uses the full diff.
      mobile_dependencies: ${{ steps.filter.outputs.mobile_dependencies }}
      static_analysis: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.static_analysis }}
      typecheck: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.typecheck }}
      mobile_ci_tools: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.mobile_ci_tools }}
      test: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.test }}
      cross-version-wire: ${{ steps.readiness.outputs.reused != 'true' && steps.filter.outputs.cross-version-wire }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fetch 50 commits for merge HEAD^1 diffs instead of all 8127 refs (~20s); sparse ~7-file blob:none checkout avoids materialization/refetch (9.5s→1.6s).
          fetch-depth: 50
          filter: blob:none
          sparse-checkout: |
            /config/scripts/git-pull-request-diff-base.mjs
            /package.json
            /README.md
            /docs/readme/
            /.github/scripts/check-root-directory-entries.mjs
            /.github/scripts/check-required-pr-context.mjs
            /.github/workflows/
            /config/.bun-version
            /config/scripts/check-readme-local-links.mjs
            /config/scripts/pr-code-change-scope.mjs
            /config/scripts/pr-shell-contract-prefixes.mjs
            /.oxfmtrc.json
            /config/scripts/pr-package-test-paths.mjs
            /config/scripts/pr-layout-oracle-route.mjs
            /config/scripts/pr-e2e-source-routing.mjs
            /config/scripts/pr-browser-e2e-source-routes.mjs
            /config/scripts/pr-editor-preview-e2e-source-routes.mjs
            /config/scripts/pr-feature-area-e2e-source-routes.mjs
            /config/scripts/pr-plugin-e2e-source-routes.mjs
            /config/scripts/pr-wsl-e2e-source-routes.mjs
            /config/scripts/ci-e2e-job-selection.mjs
            /config/scripts/pr-ready-check-reuse.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Reject new root-level files and folders
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          node .github/scripts/check-root-directory-entries.mjs "$DIFF_BASE" HEAD

      # The full Git index retains link targets outside the sparse working tree.
      - name: Check README local links
        run: node config/scripts/check-readme-local-links.mjs

      - name: Set up Bun for required workflow validation
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
          no-cache: true

      - name: Check required PR context ownership
        run: bun .github/scripts/check-required-pr-context.mjs

      # Readiness changes eligibility for advisory tests, not the already-tested source.
      - name: Find identical successful required checks
        id: readiness
        if: github.event.action == 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_CHECK_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node config/scripts/pr-ready-check-reuse.mjs

      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # PR merge HEAD’s first parent is the base; --merge-base would require the payload SHA/full history.
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          # Why --no-renames: name-only rename detection can report only the destination.
          # A code file moved under docs/ must still expose its code-side deletion.
          git diff --name-only --no-renames --diff-filter=ACDMR "$DIFF_BASE" HEAD \
            > "$RUNNER_TEMP/changed-paths.txt"
          echo "Changed paths:"
          cat "$RUNNER_TEMP/changed-paths.txt"
          # Why a file, not a pipe: the scope script reads stdin with readFileSync(0), which
          # throws EAGAIN once the payload exceeds the 64KB pipe buffer. A sync PR changes
          # thousands of paths (~330KB), so the pipe form fails every time on those.
          CHANGED_COUNT="$(wc -l < "$RUNNER_TEMP/changed-paths.txt")"
          echo "changed_count=$((CHANGED_COUNT))" >> "$GITHUB_OUTPUT"
          MOBILE_CI_ARGS=()
          if git diff --quiet --no-renames --diff-filter=ACDRTUXB "$DIFF_BASE" HEAD; then
            MOBILE_CI_ARGS=(--mobile-ci-tools --daemon-init-test-support)
          fi
          node config/scripts/pr-code-change-scope.mjs "${MOBILE_CI_ARGS[@]}" \
            < "$RUNNER_TEMP/changed-paths.txt" | tee -a "$GITHUB_OUTPUT"

  preflight:
    name: static analysis and typecheck
    needs: [code_paths]
    if: needs.code_paths.outputs.static_analysis == 'true' || needs.code_paths.outputs.typecheck == 'true'
    # Free hosted ARM: no job on the gate's critical path waits for preflight.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Fetch 50 for merge HEAD^1, no merge-base graph needed. Full-tree checkout omits blob:none to avoid refetching ~30k blobs (23s versus ~11s).
          fetch-depth: 50
          persist-credentials: false

      # Why two guarded installs: the mixed root+mobile store entry is 537 MB against
      # 321 MB for root alone, and restoring it costs 8.6s against 4.6s. Most PRs skip the
      # mobile install below, so they were paying 216 MB for packages they never link. The
      # root-only key is also the one the hourly warmer reseeds. Only one of these runs.
      - uses: ./.github/actions/install-node-dependencies
        if: needs.code_paths.outputs.mobile_dependencies != 'true'
        with:
          native-runtime: node
          node-version: '24'

      - uses: ./.github/actions/install-node-dependencies
        if: needs.code_paths.outputs.mobile_dependencies == 'true'
        with:
          native-runtime: node
          node-version: '24'
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      # Bun 1.4.3 introduces the compiler used by this job.
      - name: Set up Bun for preflight checks
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
          no-cache: true

      # Keep each check in its own log while sharing this runner.
      - name: Lint
        if: '!cancelled()'
        id: root-lint
        background: true
        env:
          PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        run: |
          if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi
          node node_modules/oxlint/bin/oxlint --format github

      - wait: root-lint

      # The compiler overlaps the remaining checks after the type-aware passes release memory.
      - name: Typecheck
        if: '!cancelled()'
        id: typecheck
        background: true
        env:
          PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.typecheck == 'true' }}
          PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        run: |
          if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi
          pnpm run typecheck:ci --bun-concurrency=2 --bun-threads=2

      - name: Verify bundled skill guides
        if: needs.code_paths.outputs.static_analysis == 'true'
        run: node config/scripts/generate-bundled-skill-guides.mjs --check

      - name: Verify skill freshness manifest
        if: needs.code_paths.outputs.static_analysis == 'true'
        run: node config/scripts/generate-skill-bundle-manifest.mjs

      - name: Verify localization catalogs
        if: '!cancelled()'
        id: localization-catalogs
        background: true
        env:
          PREFLIGHT_PHASE_SELECTED: ${{ needs.code_paths.outputs.static_analysis == 'true' }}
          PREFLIGHT_PRIOR_SUCCESS: ${{ job.status == 'success' }}
        run: |
          if [ "$PREFLIGHT_PHASE_SELECTED" != true ] || [ "$PREFLIGHT_PRIOR_SUCCESS" != true ]; then exit 0; fi
          bun config/scripts/fork-localization-catalog-check.mjs && bun config/scripts/generate-runtime-required-english-catalog.mjs

      - wait: localization-catalogs

      - wait: typecheck

      - name: Test Mobile CI tools and runtime routing
        if: needs.code_paths.outputs.mobile_ci_tools == 'true'
        env:
          ORCA_BACKGROUND_LAUNCH: '1'
          ORCA_BALANCE_UNIT_SHARDS: '1'
        run: >-
          node config/scripts/run-vitest.mjs run --config config/vitest.config.ts
          --maxWorkers=4 --isolate --retry=0 --bail=0
          config/scripts/mobile-release-check-scope.test.mjs
          config/scripts/mobile-test-change-scope.test.mjs
          config/scripts/vitest-node-runtime-boundary.test.ts
          config/scripts/vitest-sqlite-runtime-boundary.test.ts

  fork_ownership_guard:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft != true
    name: fork ownership guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Why blob:none: full history is needed for the merge-base diff, but historical
          # file contents are not. Blobs are ~89% of this repo's pack, and Git fetches the
          # few this job actually reads on demand.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Enforce fork ownership manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/check-fork-ownership.mjs "$BASE_SHA" "$HEAD_SHA"

  # Shards wait only for the plan, not preflight, which moves them about two minutes earlier.
  unit_plan:
    needs: [code_paths]
    if: needs.code_paths.outputs.test == 'true'
    uses: ./.github/workflows/unit-plan.yml
    with:
      selection_mode: ${{ vars.ORCA_UNIT_SELECTION_MODE || 'shadow' }}

  test:
    needs: [code_paths, unit_plan]
    if: >-
      !cancelled() &&
      needs.code_paths.result == 'success' &&
      needs.code_paths.outputs.test == 'true' &&
      needs.unit_plan.result == 'success'
    uses: ./.github/workflows/unit-tests.yml
    with:
      node_versions: '["24"]'
      # Free hosted ARM: 12 shards measured 361s median cold vs ~390s for 5 warm Blacksmith 8-vCPU shards.
      runner: ubuntu-24.04-arm
      phase_diagnostics: true
      # Restore main's transform cache; the `ci:cold-unit-cache` label or ORCA_UNIT_MODULE_CACHE=off forces cold.
      module_cache: ${{ (vars.ORCA_UNIT_MODULE_CACHE == 'off' || contains(github.event.pull_request.labels.*.name, 'ci:cold-unit-cache')) && 'off' || 'warm' }}
      shards: ${{ needs.unit_plan.outputs.shards }}
      run_shards: ${{ needs.code_paths.outputs.mobile_ci_tools != 'true' }}

  # Keep advisory evidence sibling to tests and outside verify.needs; reusable-workflow dependency otherwise added ~36s after last shard.
  unit_selection_evidence:
    needs: [test]
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    uses: ./.github/workflows/unit-selection-evidence.yml

  cross-version-wire:
    name: cross-version wire compatibility
    needs: [code_paths, preflight]
    if: >-
      !cancelled() &&
      needs.code_paths.result == 'success' &&
      needs.code_paths.outputs.cross-version-wire == 'true' &&
      needs.preflight.result == 'success'
    # Why ARM: source-only: tagged checkout plus in-process vitest, no docker or browser.
    runs-on: ubuntu-24.04-arm

    steps:
      # Fetch tags/full history for newest-release skew; shallow unit shards cannot supply it.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Use blob:none for merge-base history because blobs are ~89% of pack; fetch rare historical contents on demand.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node

      # Why: the suite requires electron at import time, and electron's own lazy
      # download has no retry. Install through the script that retries instead.
      - name: Install Electron package binary for tests
        run: node config/scripts/install-electron-package-binary.mjs

      # R1: an upgrade from the newest release must adopt its live terminal daemon.
      - name: Daemon protocol crossing against newest release
        run: |
          # This fork publishes only prerelease tags, which the stable-tag selector skips.
          release_ref="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)"
          pnpm run check:daemon-protocol-crossing -- --release-ref "$release_ref"

      # R3: a runtime launcher swap must not also bump the daemon protocol (D7.1).
      # The label is read from the event payload, so push again after applying it.
      - name: Runtime launcher change does not bump daemon protocol
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ORCA_ALLOW_RUNTIME_LAUNCHER_PROTOCOL_BUMP: ${{ contains(github.event.pull_request.labels.*.name, 'allow-runtime-launcher-protocol-bump') }}
        run: |
          DIFF_BASE="$(node config/scripts/git-pull-request-diff-base.mjs "$BASE_SHA")"
          pnpm run check:runtime-launcher-protocol-ratchet -- --base "$DIFF_BASE"

      # Run the entire directory; zero matches fail so new contracts cannot be omitted silently.
      - name: Old/new client and server compatibility journeys
        run: pnpm exec vitest run --config config/vitest.config.ts tests/e2e/cross-version-wire/

  verify:
    name: PR checks passed
    # Publish an explicit result after every required dependency settles.
    if: ${{ !cancelled() && github.event.pull_request.draft != true }}
    needs:
      - code_paths
      - preflight
      - fork_ownership_guard
      - test
      - cross-version-wire
    # Evaluating job results only needs the lightweight container runner.
    runs-on: ubuntu-slim
    timeout-minutes: 5

    steps:
      - name: Require successful checks
        env:
          CODE_PATHS: ${{ needs.code_paths.result }}
          SHOULD_RUN: ${{ needs.code_paths.outputs.should_run }}
          PREFLIGHT: ${{ needs.preflight.result }}
          STATIC_ANALYSIS_SHOULD_RUN: ${{ needs.code_paths.outputs.static_analysis }}
          TYPECHECK_SHOULD_RUN: ${{ needs.code_paths.outputs.typecheck }}
          PREFLIGHT_SHOULD_RUN: ${{ needs.code_paths.outputs.static_analysis == 'true' || needs.code_paths.outputs.typecheck == 'true' }}
          FORK_OWNERSHIP_GUARD: ${{ needs.fork_ownership_guard.result }}
          TEST: ${{ needs.test.result }}
          TEST_SHOULD_RUN: ${{ needs.code_paths.outputs.test }}
          CROSS_VERSION_WIRE: ${{ needs.cross-version-wire.result }}
          CROSS_VERSION_WIRE_SHOULD_RUN: ${{ needs.code_paths.outputs.cross-version-wire }}
        run: |
          if [ "$CODE_PATHS" != "success" ]; then
            exit 1
          fi
          # Why here too: the ownership guard is ungated, so a docs-only PR still
          # runs it, and a docs-only path that never reads its result would let an
          # undeclared manifest change through the one check that exists to catch it.
          if [ "$FORK_OWNERSHIP_GUARD" != "success" ]; then
            exit 1
          fi
          case "$STATIC_ANALYSIS_SHOULD_RUN:$TYPECHECK_SHOULD_RUN" in
            true:true|true:false|false:true|false:false) ;;
            *) echo "preflight: missing or invalid selection"; exit 1 ;;
          esac
          if [ "$SHOULD_RUN" != "true" ]; then
            echo "Docs-only change; expensive PR checks skipped."
          fi
          failed=0
          check_job() {
            local name="$1" result="$2" should="$3"
            if [ "$should" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "$name: expected success, got $result"
                failed=1
              fi
            elif [ "$should" = "false" ]; then
              if [ "$result" != "skipped" ]; then
                echo "$name: expected skipped, got $result"
                failed=1
              fi
            else
              echo "$name: missing or invalid selection"
              failed=1
            fi
          }
          # Require success when the PR has code-relevant changes
          check_job preflight "$PREFLIGHT" "$PREFLIGHT_SHOULD_RUN"
          check_job test "$TEST" "$TEST_SHOULD_RUN"
          check_job cross-version-wire "$CROSS_VERSION_WIRE" "$CROSS_VERSION_WIRE_SHOULD_RUN"
          exit "$failed"
